version: '3.8'
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hashwatch
      POSTGRES_USER: hashwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hashwatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready
      interval: 10s

  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://hashwatch:${DB_PASSWORD:-hashwatch}@db:5432/hashwatch
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
