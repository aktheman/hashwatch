services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hashwatch
      POSTGRES_USER: hashwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hashwatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashwatch -d hashwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: .
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hashwatch:${DB_PASSWORD:-hashwatch}@db:5432/hashwatch
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
