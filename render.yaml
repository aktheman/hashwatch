services:
  - type: web
    name: hashwatch-backend
    runtime: docker
    repo: https://github.com/aktheman/hashwatch
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_TRIAL_DAYS
        sync: false
      - key: ADMIN_USER_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COMMIT_SHA
        sync: false
